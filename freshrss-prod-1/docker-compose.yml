services:
  freshrss:
    #image: freshrss/freshrss:edge
    image: freshrss/freshrss:latest
    # Optional build section if you want to build the image locally:
    # build:
    #   # Pick #edge (rolling release) or #latest (versioned release) or a specific release like #1.21.0
    #   context: https://github.com/FreshRSS/FreshRSS.git#edge
    #   dockerfile: Docker/Dockerfile-Alpine
    container_name: freshrss-prod-1
    restart: unless-stopped
    env_file: 
      - /opt/repos/kaneworld/freshrss-prod-1/.env
      #- /home/murry/containers/freshrss-prod-1/.env
    logging:
      options:
        max-size: 10m
    volumes:
      # Recommended volume for FreshRSS persistent data such as configuration and SQLite databases
      #- data:/var/www/FreshRSS/data
      - /murry/containers/freshrss-prod-1/data:/var/www/FreshRSS/data
      # Optional volume for storing third-party extensions
      #- extensions:/var/www/FreshRSS/extensions
      - /murry/containers/freshrss-prod-1/extensions:/var/www/FreshRSS/extensions
      # Optional file providing custom global settings (used before a FreshRSS install)
      #- ./config.custom.php:/var/www/FreshRSS/data/config.custom.php
      - /murry/containers/freshrss-prod-1/config.custom.php:/var/www/FreshRSS/data/config.custom.php
      # Optional file providing custom user settings (used before a new user is created)
      - /murry/containers/freshrss-prod-1/config-user.custom.php:/var/www/FreshRSS/data/config-user.custom.php
    ports:
      # If you want to open a port 8080 on the local machine:
      - "8080:80"
    environment:
      # A timezone https://www.php.net/timezones (default is UTC)
      TZ: America/Los_Angeles
      # Cron job to refresh feeds at specified minutes
      CRON_MIN: '2,32'
      # Optional 'development' for additional logs; default is 'production'
      FRESHRSS_ENV: development
      # Optional advanced parameter controlling the internal Apache listening port
      LISTEN: 0.0.0.0:80
      # Optional parameter to allow sending requests to certain internal hosts, by default all internal requests are blocked
      # Examples: 127.0.0.1:8080, rss-bridge:80, etc.
      #   or a CIDR notation: 0.0.0.0/0 (to allow any IPv4), ::/0 (to allow any IPv6)
      # Setting * disables this check completely, allowing any host to be accessed (unsafe)
      #INTERNAL_HOST_ALLOWLIST: rss-bridge:80 rsshub:1200

      # Optional parameter, remove for automatic settings, set to 0 to disable,
      # or (if you use a proxy) to a space-separated list of trusted IPs or CIDR
      # notation for ranges. Domain names are not supported and will be ignored.
      # This impacts which IP address is logged (X-Forwarded-For or REMOTE_ADDR).
      # This also impacts external authentication methods;
      # see https://freshrss.github.io/FreshRSS/en/admins/09_AccessControl.html
      TRUSTED_PROXY: 172.16.0.1/12 192.168.0.1/16
      # Optional parameter, set to 1 to enable OpenID Connect (only available in our Debian image)
      # Requires more environment variables. See https://freshrss.github.io/FreshRSS/en/admins/16_OpenID-Connect.html
      OIDC_ENABLED: 0
      # Optional auto-install parameters (the Web interface install is recommended instead):
      # ⚠️ Parameters below are only used at the very first run (so far).
      # So if changes are made (or in .env file), first delete the service and volumes.
      # ℹ️ All the --db-* parameters can be omitted if using built-in SQLite database.
      FRESHRSS_INSTALL: |-
        --api-enabled
        --base-url ${BASE_URL}
        --db-base ${DB_BASE}
        --db-host ${DB_HOST}
        --db-password ${DB_PASSWORD}
        --db-type ${DB_TYPE-sqlite}
        --db-user ${DB_USER}
        --default-user ${ADMIN_USER}
        --language en
      FRESHRSS_USER: |-
        --api-password ${ADMIN_API_PASSWORD}
        --email ${ADMIN_EMAIL}
        --language en
        --password ${ADMIN_PASSWORD}
        --user ${ADMIN_USER}
    # Optional healthcheck
    healthcheck:
      test: ["CMD", "cli/health.php"]
      timeout: 10s
      start_period: 60s
      start_interval: 11s
      interval: 75s
      retries: 3
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.${TRAEFIK_ROUTER_NAME}.entrypoints=${TRAEFIK_PROTOCOL_HTTP}"
      - "traefik.http.routers.${TRAEFIK_ROUTER_NAME}.rule=Host(`${TRAEFIK_DOMAIN}`)"
      - "traefik.http.middlewares.${TRAEFIK_ROUTER_NAME}-https-redirect.redirectscheme.scheme=${TRAEFIK_PROTOCOL_HTTPS}"
      - "traefik.http.routers.${TRAEFIK_ROUTER_NAME}.middlewares=${TRAEFIK_ROUTER_NAME}-https-redirect"
      - "traefik.http.routers.${TRAEFIK_ROUTER_NAME}-secure.entrypoints=${TRAEFIK_PROTOCOL_HTTPS}"
      - "traefik.http.routers.${TRAEFIK_ROUTER_NAME}-secure.rule=Host(`${TRAEFIK_DOMAIN}`)"
      - "traefik.http.routers.${TRAEFIK_ROUTER_NAME}-secure.tls=true"
      - "traefik.http.routers.${TRAEFIK_ROUTER_NAME}-secure.service=${TRAEFIK_ROUTER_NAME}"
      - "traefik.http.services.${TRAEFIK_ROUTER_NAME}.loadbalancer.server.port=${TRAEFIK_UI_PORT}"
      - "traefik.docker.network=${TRAEFIK_PROXY}"
    networks:
      proxy:

networks:
  proxy:
    external: true